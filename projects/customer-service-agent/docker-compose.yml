services:
  agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WECOM_HOST: 0.0.0.0
      WECOM_PORT: 8080
      DATABASE_PATH: /app/data/agent_v2.db
      CATALOG_PATH: /app/private/catalog
      KNOWLEDGE_PATH: /app/knowledge
      WECOM_MEDIA_PATH: /app/private/wecom-media
      PAYMENT_POLICY_PATH: /app/private/payment-policy.json
      WECHAT_PAYMENT_CODE_PATH: /app/private/payment-codes/wechat.jpg
      ALIPAY_PAYMENT_CODE_PATH: /app/private/payment-codes/alipay.jpg
    volumes:
      - ./data:/app/data
      - ./private:/app/private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
